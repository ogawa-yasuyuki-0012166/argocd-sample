apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ogawa-yasuyuki-0012166/argocd-sample.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true